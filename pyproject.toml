[project]
name = "trading-ai-agents"
version = "0.1.0"
description = "A small LangGraph and yfinance trading-agent workflow for learning"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "The Trading AI Agents contributors" }]
keywords = ["agents", "langgraph", "llm", "trading", "yfinance", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "yfinance>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/tuokaikyle/trading-ai-agents"
Repository = "https://github.com/tuokaikyle/trading-ai-agents"
Issues = "https://github.com/tuokaikyle/trading-ai-agents/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
